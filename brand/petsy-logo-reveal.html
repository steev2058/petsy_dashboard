<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Petsy — Logo Reveal</title>
  <style>
    :root { --orange: #FE860E; --hold: 7.05s; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background: #0f0f0f;
      display: grid; place-items: center;
      font-family: system-ui, sans-serif;
      overflow: hidden;
    }
    .stage {
      width: min(100vw, calc(100vh * 16 / 9));
      aspect-ratio: 16 / 9;
      background: #fff;
      position: relative;
      overflow: hidden;
      box-shadow: 0 24px 70px rgba(0,0,0,.42);
    }

    /* Exact MP4 motion */
    .reel {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: contain;
      background: #fff;
      opacity: 1;
      transition: opacity .55s ease;
    }
    .reel.is-done { opacity: 0; pointer-events: none; }

    /* Exact uploaded logo — same scale/placement as MP4 end frame */
    .final {
      position: absolute; inset: 0;
      display: grid; place-items: center;
      background: #fff;
      opacity: 0;
      transition: opacity .55s ease;
      pointer-events: none;
    }
    .final.is-on { opacity: 1; }
    .final img {
      /* MP4 last-frame logo ≈ 27.6% stage width, centered */
      width: 27.6%;
      height: auto;
      display: block;
      image-rendering: auto;
      -webkit-user-drag: none;
    }

    /* Fallback layered reveal if video fails */
    .layers {
      position: absolute; inset: 0;
      display: none;
      place-items: center;
      background: #fff;
    }
    .layers.on { display: grid; }
    .logo {
      width: 27.6%;
      aspect-ratio: 558 / 588;
      position: relative;
      transform-origin: 50% 45%;
    }
    .logo img {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: fill;
      pointer-events: none;
      -webkit-user-drag: none;
    }
    .toe { opacity: 0; transform: translateY(-10%) scale(.55); animation: toeIn .5s cubic-bezier(.34,1.56,.64,1) forwards; }
    .t1 { animation-delay: .12s; }
    .t2 { animation-delay: .38s; }
    .t3 { animation-delay: .64s; }
    .t4 { animation-delay: .90s; }
    @keyframes toeIn {
      0% { opacity: 0; transform: translateY(-12%) scale(.5); }
      70% { opacity: 1; transform: translateY(1%) scale(1.06); }
      100% { opacity: 1; transform: none; }
    }
    .pad {
      opacity: 0;
      clip-path: inset(100% 0 0 0);
      animation: padUp 1.35s cubic-bezier(.45,.05,.2,1) forwards 1.45s;
    }
    @keyframes padUp {
      0% { opacity: 0; clip-path: inset(100% 0 0 0); }
      12% { opacity: 1; }
      100% { opacity: 1; clip-path: inset(0); }
    }
    .heart {
      opacity: 0; transform-origin: 50% 28%;
      animation: heartIn .18s ease forwards 3.55s, heartPulse .7s cubic-bezier(.34,1.4,.64,1) 3.7s 1;
    }
    @keyframes heartIn { to { opacity: 1; } }
    @keyframes heartPulse {
      0% { transform: scale(1); }
      40% { transform: scale(1.22); }
      100% { transform: scale(1); }
    }
    .logo.bounce { animation: bounce .75s cubic-bezier(.34,1.45,.64,1) 3.9s 1; }
    @keyframes bounce {
      0% { transform: scale(1); }
      35% { transform: scale(1.05); }
      70% { transform: scale(.985); }
      100% { transform: scale(1); }
    }
    .letters {
      opacity: 0; clip-path: inset(0 100% 0 0);
      animation: wipe 1.05s cubic-bezier(.45,.05,.25,1) forwards 4.7s;
    }
    .underline {
      opacity: 0; clip-path: inset(0 100% 0 0);
      animation: wipe .7s cubic-bezier(.45,.05,.25,1) forwards 5.55s;
    }
    @keyframes wipe { to { opacity: 1; clip-path: inset(0); } }
    .layers-final {
      position: absolute; inset: 0;
      display: grid; place-items: center;
      background: #fff;
      opacity: 0;
      animation: finalIn .85s ease forwards 6.9s;
    }
    .layers-final img { width: 27.6%; height: auto; display: block; }
    @keyframes finalIn { to { opacity: 1; } }

    .replay {
      position: fixed; bottom: 18px; right: 18px; z-index: 5;
      border: 0; border-radius: 999px; cursor: pointer;
      background: var(--orange); color: #fff; font-weight: 700;
      padding: 10px 16px;
    }
    .meta {
      position: fixed; left: 18px; bottom: 22px; color: #999;
      font-size: 12px; z-index: 5;
    }
  </style>
</head>
<body>
  <div class="stage" id="stage">
    <video
      class="reel"
      id="reel"
      src="./petsy-logo-reveal.mp4"
      muted
      playsinline
      preload="auto"
      autoplay
    ></video>
    <div class="final" id="final">
      <img src="./layers/full.png" alt="Petsy" width="558" height="588" />
    </div>
    <div class="layers" id="layers" aria-hidden="true">
      <div class="logo bounce">
        <img class="toe t1" src="./layers/toes.png" alt="" />
        <img class="pad" src="./layers/pad-full.png" alt="" />
        <img class="heart" src="./layers/heart.png" alt="" />
        <img class="letters" src="./layers/letters.png" alt="" />
        <img class="underline" src="./layers/underline.png" alt="" />
      </div>
      <div class="layers-final">
        <img src="./layers/full.png" alt="Petsy" />
      </div>
    </div>
  </div>
  <button class="replay" type="button" id="replay">Replay</button>
  <div class="meta">Petsy · MP4-accurate motion · exact logo hold · 8s · 16:9</div>
  <script>
    (function () {
      const HOLD = 7.05;
      const reel = document.getElementById('reel');
      const final = document.getElementById('final');
      const layers = document.getElementById('layers');
      let locked = false;

      function showExactLogo() {
        if (locked) return;
        locked = true;
        final.classList.add('is-on');
        reel.classList.add('is-done');
        try { reel.pause(); } catch (_) {}
      }

      function useFallback() {
        reel.style.display = 'none';
        layers.classList.add('on');
        layers.setAttribute('aria-hidden', 'false');
        // layered CSS timeline ends on exact full.png
      }

      reel.addEventListener('timeupdate', function () {
        if (reel.currentTime >= HOLD) showExactLogo();
      });
      reel.addEventListener('ended', showExactLogo);
      reel.addEventListener('error', useFallback);

      // If autoplay blocked, still kick playback
      const play = reel.play();
      if (play && typeof play.catch === 'function') {
        play.catch(function () {
          // try muted again then fallback
          reel.muted = true;
          reel.play().catch(useFallback);
        });
      }

      document.getElementById('replay').addEventListener('click', function () {
        location.reload();
      });
    })();
  </script>
</body>
</html>
