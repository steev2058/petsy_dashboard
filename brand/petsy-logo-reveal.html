<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Petsy — Logo Reveal</title>
  <style>
    :root {
      --orange: #FE860E;
      --brown: #5C2F1E;
      --white: #FFFFFF;
      --duration: 8s;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background: #111;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .stage {
      width: min(100vw, calc(100vh * 16 / 9));
      aspect-ratio: 16 / 9;
      background: var(--white);
      position: relative;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
    }
    .logo-wrap {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
    }
    .stack {
      width: min(42%, 360px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2.2%;
      transform-origin: center center;
    }
    .icon {
      width: 100%;
      aspect-ratio: 1;
      position: relative;
    }
    svg.mark {
      width: 100%;
      height: 100%;
      overflow: visible;
      display: block;
    }

    /* toes */
    .toe {
      fill: var(--orange);
      opacity: 0;
      transform-box: fill-box;
      transform-origin: center bottom;
      animation: toeIn 0.55s cubic-bezier(.34,1.56,.64,1) forwards;
    }
    .toe1 { animation-delay: 0.15s; }
    .toe2 { animation-delay: 0.45s; }
    .toe3 { animation-delay: 0.75s; }
    .toe4 { animation-delay: 1.05s; }
    .spark {
      stroke: var(--orange);
      stroke-width: 5;
      stroke-linecap: round;
      opacity: 0;
      animation: fadeIn 0.35s ease forwards 1.2s;
    }
    @keyframes toeIn {
      0% { opacity: 0; transform: translateY(-28px) scale(.4); }
      70% { opacity: 1; transform: translateY(4px) scale(1.08); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* paw pad stroke draw */
    .pad-stroke {
      fill: none;
      stroke: var(--orange);
      stroke-width: 72;
      stroke-linejoin: round;
      stroke-linecap: round;
      stroke-dasharray: 1200;
      stroke-dashoffset: 1200;
      animation: drawPad 1.2s cubic-bezier(.45,.05,.25,1) forwards 1.5s;
    }
    .pad-fill {
      fill: var(--orange);
      opacity: 0;
      animation: fadeIn 0.35s ease forwards 2.45s;
    }
    @keyframes drawPad {
      to { stroke-dashoffset: 0; }
    }

    .dog {
      opacity: 0;
      transform-box: fill-box;
      transform-origin: 45% 70%;
      animation: dogRise 1.1s cubic-bezier(.22,1,.36,1) forwards 1.85s;
    }
    .dog-ear {
      transform-box: fill-box;
      transform-origin: 70% 15%;
      animation: earWag 0.7s ease-in-out 2.4s 2 alternate;
    }
    .dog-eye {
      transform-box: fill-box;
      transform-origin: center;
      animation: blink 0.22s ease 2.7s 1;
    }
    @keyframes dogRise {
      0% { opacity: 0; transform: translateY(28px) scale(.92); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes earWag {
      from { transform: rotate(-4deg); }
      to { transform: rotate(10deg); }
    }

    .cat {
      opacity: 0;
      transform-box: fill-box;
      transform-origin: 35% 60%;
      animation: catPeek 1.15s cubic-bezier(.22,1,.36,1) forwards 3.05s;
    }
    .cat-eye {
      transform-box: fill-box;
      transform-origin: center;
      animation: blink 0.2s ease 3.9s 1;
    }
    @keyframes catPeek {
      0% { opacity: 0; transform: translate(18px, 16px) rotate(12deg) scale(.86); }
      65% { opacity: 1; transform: translate(-2px, -2px) rotate(-3deg) scale(1.03); }
      100% { opacity: 1; transform: translate(0, 0) rotate(0deg) scale(1); }
    }
    @keyframes blink {
      0%,100% { transform: scaleY(1); }
      50% { transform: scaleY(.15); }
    }

    .heart {
      fill: #fff;
      opacity: 0;
      transform-box: fill-box;
      transform-origin: center;
      animation:
        fadeIn 0.25s ease forwards 4.35s,
        heartPulse 0.7s cubic-bezier(.34,1.4,.64,1) 4.55s 1;
    }
    @keyframes heartPulse {
      0% { transform: scale(1); }
      40% { transform: scale(1.28); }
      100% { transform: scale(1); }
    }

    .stack.bounce {
      animation: logoBounce 0.75s cubic-bezier(.34,1.45,.64,1) 4.7s 1;
    }
    @keyframes logoBounce {
      0% { transform: scale(1); }
      35% { transform: scale(1.06); }
      70% { transform: scale(.985); }
      100% { transform: scale(1); }
    }

    .wordmark {
      display: flex;
      gap: 0;
      line-height: 1;
      margin-top: 2%;
      position: relative;
      z-index: 2;
    }
    .letter {
      font-family: "Avenir Next Rounded", "Nunito", "Poppins", "Segoe UI", sans-serif;
      font-weight: 800;
      font-size: clamp(36px, 6.2vw, 72px);
      color: var(--brown);
      opacity: 0;
      display: inline-block;
      transform: translateY(18px);
      animation: letterIn 0.42s cubic-bezier(.34,1.45,.64,1) forwards;
    }
    .letter:nth-child(1) { animation-delay: 5.55s; }
    .letter:nth-child(2) { animation-delay: 5.68s; }
    .letter:nth-child(3) { animation-delay: 5.81s; }
    .letter:nth-child(4) { animation-delay: 5.94s; }
    .letter:nth-child(5) { animation-delay: 6.07s; }
    @keyframes letterIn {
      to { opacity: 1; transform: translateY(0); }
    }

    .underline {
      width: 68%;
      height: 10px;
      margin-top: -2%;
      overflow: visible;
    }
    .underline path {
      fill: none;
      stroke: var(--orange);
      stroke-width: 9;
      stroke-linecap: round;
      stroke-dasharray: 280;
      stroke-dashoffset: 280;
      animation: drawLine 0.7s cubic-bezier(.45,.05,.25,1) forwards 6.35s;
    }
    @keyframes drawLine { to { stroke-dashoffset: 0; } }
    @keyframes fadeIn { to { opacity: 1; } }

    /* final exact logo hold */
    .final {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background: #fff;
      opacity: 0;
      animation: finalHold 1.05s ease forwards 7s;
      pointer-events: none;
    }
    .final img {
      width: min(34%, 320px);
      height: auto;
      display: block;
    }
    @keyframes finalHold {
      0% { opacity: 0; }
      18% { opacity: 1; }
      100% { opacity: 1; }
    }

    .replay {
      position: fixed;
      bottom: 18px;
      right: 18px;
      border: 0;
      background: var(--orange);
      color: #fff;
      font-weight: 700;
      padding: 10px 16px;
      border-radius: 999px;
      cursor: pointer;
      z-index: 20;
    }
    .meta {
      position: fixed;
      bottom: 22px;
      left: 18px;
      color: #aaa;
      font-size: 12px;
      z-index: 20;
    }
  </style>
</head>
<body>
  <div class="stage" id="stage" aria-label="Petsy 8 second logo reveal">
    <div class="logo-wrap">
      <div class="stack bounce" id="stack">
        <div class="icon">
          <svg class="mark" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
            <!-- 4 toe pads -->
            <ellipse class="toe toe1" cx="112" cy="78" rx="28" ry="34" />
            <ellipse class="toe toe2" cx="168" cy="52" rx="31" ry="37" />
            <ellipse class="toe toe3" cx="232" cy="52" rx="31" ry="37" />
            <ellipse class="toe toe4" cx="288" cy="78" rx="28" ry="34" />
            <path class="spark" d="M318 54 l10 -14 M328 62 l12 -8" />

            <!-- large paw outline / fill -->
            <path class="pad-stroke" d="M118 150
              C90 170 78 210 88 250
              C98 292 130 320 170 332
              C200 340 235 338 265 322
              C300 302 322 262 318 220
              C314 182 290 152 250 142
              C220 134 185 136 155 145
              C140 145 128 146 118 150 Z" />
            <path class="pad-fill" d="M118 150
              C90 170 78 210 88 250
              C98 292 130 320 170 332
              C200 340 235 338 265 322
              C300 302 322 262 318 220
              C314 182 290 152 250 142
              C220 134 185 136 155 145
              C140 145 128 146 118 150 Z" />

            <!-- dog -->
            <g class="dog">
              <path fill="#fff" d="M145 210
                C138 230 142 265 165 285
                C185 300 210 295 225 278
                C235 265 238 245 230 228
                C220 205 190 198 165 205
                C155 208 148 208 145 210 Z" />
              <path class="dog-ear" fill="#FE860E" d="M152 215 C138 205 128 225 138 245 C148 255 162 242 160 228 C159 220 156 216 152 215 Z" />
              <path fill="#5C2F1E" d="M208 250 l14 8 l-16 6 z" />
              <path class="dog-eye" stroke="#5C2F1E" stroke-width="4" stroke-linecap="round" fill="none" d="M178 238 q8 8 16 0" />
              <path stroke="#5C2F1E" stroke-width="3" stroke-linecap="round" fill="none" d="M198 268 q8 8 16 -2" />
            </g>

            <!-- cat -->
            <g class="cat">
              <path fill="#fff" d="M248 228
                L262 198 L278 218
                C300 215 318 238 312 268
                C306 295 275 305 252 292
                C235 282 232 250 248 228 Z" />
              <path fill="#fff" d="M248 228 L236 198 L252 218 Z" />
              <path class="cat-eye" stroke="#5C2F1E" stroke-width="3.5" stroke-linecap="round" fill="none" d="M262 248 q6 6 12 0" />
              <path class="cat-eye" stroke="#5C2F1E" stroke-width="3.5" stroke-linecap="round" fill="none" d="M284 250 q6 6 12 0" />
              <path stroke="#5C2F1E" stroke-width="3" stroke-linecap="round" fill="none" d="M278 268 q-4 6 4 6" />
              <path stroke="#5C2F1E" stroke-width="2.5" stroke-linecap="round" d="M300 262 l18 -4 M302 270 l18 2 M300 278 l16 6" />
            </g>

            <path class="heart" d="M198 168
              C198 168 188 158 178 168
              C168 178 198 198 198 198
              C198 198 228 178 218 168
              C208 158 198 168 198 168 Z" />
          </svg>
        </div>

        <div class="wordmark" aria-label="Petsy">
          <span class="letter">P</span>
          <span class="letter">e</span>
          <span class="letter">t</span>
          <span class="letter">s</span>
          <span class="letter">y</span>
        </div>
        <svg class="underline" viewBox="0 0 280 20" aria-hidden="true">
          <path d="M10 12 C70 4, 140 18, 210 8 C230 5, 255 10, 270 12" />
        </svg>
      </div>
    </div>

    <div class="final">
      <img src="./petsy-logo-tight.png" alt="Petsy logo" />
    </div>
  </div>

  <button class="replay" type="button" id="replay">Replay</button>
  <div class="meta">Petsy · 8s · 16:9 · splash reveal</div>

  <script>
    const replay = () => {
      const stage = document.getElementById('stage');
      const clone = stage.cloneNode(true);
      stage.replaceWith(clone);
      // rebind is unnecessary because animations restart on fresh DOM;
      // rebuild replay button handler after clone replaces stage only
    };
    document.getElementById('replay').addEventListener('click', () => location.reload());
  </script>
</body>
</html>
